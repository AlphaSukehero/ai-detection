name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-eeg.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      # Model checkpoints are not in git (see .gitignore), so the tests that
      # need one skip themselves rather than fail. Everything that encodes a
      # correctness guarantee -- the ECG measurement maths, the model-card
      # registry, the upload name policy, and the regression tests that keep
      # the fabricated-output fallbacks from returning -- runs without them.
      - name: Test
        run: pytest -q
